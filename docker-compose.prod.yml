services:
  icecast:
    image: moul/icecast
    env_file:
      - .env
    restart: unless-stopped

  minio:
    image: minio/minio
    env_file:
      - .env
    command: server /data --console-address ":9001"
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:9000/minio/health/live >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 12

  minio-init:
    image: minio/mc
    env_file:
      - .env
    depends_on:
      minio:
        condition: service_healthy
    restart: "no"
    entrypoint: ["/bin/sh", "/init.sh"]
    volumes:
      - ./deploy/minio-init.sh:/init.sh:ro

  redis:
    image: redis:7-alpine
    env_file:
      - .env
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 12

  radio:
    build: .
    env_file:
      - .env
    depends_on:
      icecast:
        condition: service_started
      minio-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    restart: unless-stopped
    volumes:
      - radio-cache:/var/cache/radio-engine
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/health/ready | grep -q '\"ready\":true' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 18

  nginx:
    image: nginx:1.27-alpine
    env_file:
      - .env
    depends_on:
      radio:
        condition: service_healthy
    restart: unless-stopped
    environment:
      NGINX_SERVER_NAME: ${DOMAIN:-radio.example.com}
    ports:
      - "80:80"
    volumes:
      - ./deploy/nginx.conf.template:/etc/nginx/templates/default.conf.template:ro

volumes:
  minio-data:
  radio-cache: