services:
  icecast:
    image: moul/icecast
    ports:
      - "8000:8000"
    environment:
      ICECAST_SOURCE_PASSWORD: hackme
      ICECAST_ADMIN_PASSWORD: admin
      ICECAST_RELAY_PASSWORD: hackme
      ICECAST_HOSTNAME: localhost
    restart: unless-stopped

  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-admin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-admin123}
    volumes:
      - minio-data:/data
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    restart: unless-stopped

  radio:
    build: .
    env_file:
      - .env
    depends_on:
      - icecast
      - minio
      - redis
    ports:
      - "8080:8080"
    environment:
      HTTP_ADDR: :8080
      ICECAST_URL: http://icecast:8000
      MINIO_ENDPOINT: minio:9000
      REDIS_ADDR: redis:6379
      MEDIA_CACHE_DIR: /var/cache/radio-engine
    volumes:
      - radio-cache:/var/cache/radio-engine
    restart: unless-stopped

volumes:
  minio-data:
  radio-cache:
