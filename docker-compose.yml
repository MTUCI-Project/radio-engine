services:
  icecast:
    image: moul/icecast
    ports:
      - "8000:8000"
    environment:
      ICECAST_SOURCE_PASSWORD: hackme
      ICECAST_ADMIN_PASSWORD: admin
      ICECAST_RELAY_PASSWORD: hackme
      ICECAST_HOSTNAME: localhost
    restart: unless-stopped

  radio:
    build: .
    depends_on:
      - icecast
    ports:
      - "8080:8080"
    volumes:
      - ./tracklist:/app/tracklist:ro
    environment:
      ICECAST_URL: http://icecast:8000
      ICECAST_SOURCE_PASSWORD: hackme
      ICECAST_MOUNT: /radio.mp3
      STATION_ID: ${STATION_ID:-default}
      STATION_COUNT: ${STATION_COUNT:-}
      STATIONS: ${STATIONS:-}
      STATION_NAME: ${STATION_NAME:-}
      HTTP_ADDR: :8080
      PLAYLIST_DIR: tracklist
      ANNOUNCEMENTS_DIR: ""
    restart: unless-stopped
